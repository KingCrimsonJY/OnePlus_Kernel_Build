name: Build OnePlus Ace Pro Kernel (Docker/systemd + SUSFS)

on:
  workflow_dispatch:
    inputs:
      debug_on_failure:
        description: '编译失败时开启 SSH 调试 (tmate)'
        required: true
        type: boolean
        default: true

jobs:
  build:
    name: Extreme Build Kernel
    runs-on: ubuntu-24.04
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Display Runner Hardware Specs
      run: |
        echo "=== CPU Info ==="
        lscpu
        echo "=== Memory Info ==="
        free -h
        echo "=== Disk Info ==="
        df -h

    - name: Maximize Runner Disk Space & Create Swap
      run: |
        echo "正在执行暴力空间清理，释放冗余环境..."
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo rm -rf /usr/local/share/boost
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"
        
        echo "清理完成，磁盘空间现状："
        df -h
        
        echo "创建 10GB Swap 虚拟内存..."
        sudo swapoff -a || true
        sudo rm -f /mnt/swapfile
        sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=10240 status=progress
        sudo chmod 600 /mnt/swapfile
        sudo mkswap /mnt/swapfile
        sudo swapon /mnt/swapfile
        
        echo "内存状态现状："
        free -h

    - name: Setup Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick libncurses-dev lib32readline-dev lib32z1-dev liblz4-tool libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3
        
    - name: Setup ccache (云端编译加速)
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ runner.os }}-kernel-sm8475-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-kernel-sm8475-
        max-size: "4G"

    - name: Download AOSP Clang
      run: |
        mkdir -p $GITHUB_WORKSPACE/clang
        cd $GITHUB_WORKSPACE/clang
        curl -LO https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r522817.tar.gz
        tar -xf clang-r522817.tar.gz
        rm clang-r522817.tar.gz

    - name: Clone Kernel Source (Ace Pro / 10T Branch)
      run: |
        git clone --depth=1 --branch oneplus/sm8475_v_15.0.0_oneplus_ace_pro https://github.com/OnePlusOSS/android_kernel_oneplus_sm8475.git kernel
        
    - name: Inject SUSFS Core Patches
      run: |
        git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git susfs
        cd kernel
        cp -r ../susfs/kernel_patches/fs/* fs/
        cp -r ../susfs/kernel_patches/include/linux/* include/linux/
        patch -p1 < ../susfs/kernel_patches/5.10/susfs.patch
        echo "CONFIG_KSU_SUSFS=y" >> arch/arm64/configs/vendor/waipio-qgki_defconfig
        echo "CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y" >> arch/arm64/configs/vendor/waipio-qgki_defconfig

    - name: Apply Docker/LXC & Extreme Speed Defconfig Patches
      run: |
        cat << 'EOF' >> kernel/arch/arm64/configs/vendor/waipio-qgki_defconfig
        CONFIG_DEBUG_INFO=n
        CONFIG_LTO_CLANG_THIN=y
        CONFIG_LTO_CLANG_FULL=n
        CONFIG_NAMESPACES=y
        CONFIG_NET_NS=y
        CONFIG_PID_NS=y
        CONFIG_IPC_NS=y
        CONFIG_UTS_NS=y
        CONFIG_USER_NS=y
        CONFIG_CGROUPS=y
        CONFIG_CGROUP_CPUACCT=y
        CONFIG_CGROUP_DEVICE=y
        CONFIG_CGROUP_FREEZER=y
        CONFIG_CGROUP_SCHED=y
        CONFIG_CPUSETS=y
        CONFIG_MEMCG=y
        CONFIG_CGROUP_PIDS=y
        CONFIG_CGROUP_PERF=y
        CONFIG_CGROUP_HUGETLB=y
        CONFIG_NET_CLS_CGROUP=y
        CONFIG_CFS_BANDWIDTH=y
        CONFIG_VETH=y
        CONFIG_BRIDGE=y
        CONFIG_BRIDGE_NETFILTER=y
        CONFIG_IP_NF_FILTER=y
        CONFIG_IP_NF_TARGET_MASQUERADE=y
        CONFIG_IP_NF_NAT=y
        CONFIG_NF_NAT=y
        CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
        CONFIG_NETFILTER_XT_MATCH_IPVS=y
        CONFIG_IP6_NF_NAT=y
        CONFIG_IP6_NF_TARGET_MASQUERADE=y
        CONFIG_IP_VS=y
        CONFIG_MACVLAN=y
        CONFIG_DUMMY=y
        CONFIG_POSIX_MQUEUE=y
        CONFIG_KEYS=y
        CONFIG_OVERLAY_FS=y
        EOF

    - name: Compile Kernel
      id: compile
      run: |
        cd kernel
        export PATH="/usr/lib/ccache:$GITHUB_WORKSPACE/clang/bin:$PATH"
        export CLANG_TRIPLE="aarch64-linux-gnu-"
        export CROSS_COMPILE="aarch64-linux-android-"
        export ARCH=arm64
        
        make O=out vendor/waipio-qgki_defconfig
        
        # 强制 LTO=thin 环境变量，配合 ccache 和全套 LLVM 工具链加速
        make -j$(nproc --all) O=out CC="ccache clang" LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip LTO=thin LLVM=1 LLVM_IAS=1 Image.gz dtb.img
        
        if [ ! -f out/arch/arm64/boot/Image.gz ]; then
          echo "Kernel compilation failed! Please check logs or connect via tmate."
          exit 1
        fi

    - name: Setup tmate Session (On Failure)
      if: ${{ failure() && inputs.debug_on_failure }}
      uses: mxschmitt/action-tmate@v3
      with:
        limit-access-to-actor: true
        
    - name: Package with AnyKernel3
      if: ${{ success() }}
      run: |
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
        rm -rf AnyKernel3/.git
        sed -i 's/kernel.string=Custom Kernel/kernel.string=OnePlus Ace Pro Docker+SUSFS Kernel/g' AnyKernel3/anykernel.sh
        sed -i 's/block=auto/block=\/dev\/block\/bootdevice\/by-name\/boot/g' AnyKernel3/anykernel.sh
        
        cp kernel/out/arch/arm64/boot/Image.gz AnyKernel3/
        cd AnyKernel3
        zip -r9 ../OnePlus_Ace_Pro_Docker_SUSFS_Kernel.zip *
        
    - name: Upload Artifact
      if: ${{ success() }}
      uses: actions/upload-artifact@v4
      with:
        name: OnePlus_Ace_Pro_Docker_SUSFS_Kernel
        path: OnePlus_Ace_Pro_Docker_SUSFS_Kernel.zip
