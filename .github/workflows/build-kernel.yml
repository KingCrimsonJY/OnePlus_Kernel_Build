# ============================================================================
# Build LXC / Docker Kernel for OnePlus Ace Pro (sm8475 / 骁龙 8+ Gen 1)
# android12-5.10 GKI 构建 · 集成 SUSFS + BBR + LXC/systemd/Docker 全部 CONFIG
# 命令基线来自 Xiaomichael/OnePlus-Actions (sm8475, android12/5.10) 实测可编译流程
# ============================================================================
name: Build LXC/Docker Kernel (sm8475 / Ace Pro)

on:
  workflow_dispatch:
    inputs:
      FEIL:
        description: '设备 manifest 文件名 (Ace Pro 默认 oneplus_ace_pro_v)'
        required: true
        default: 'oneplus_ace_pro_v'
        type: string
      CPU:
        description: '平台代号'
        required: true
        default: 'sm8475'
        type: string
      KSU:
        description: '集成 KernelSU-Next (Root 强控制态)'
        required: true
        default: true
        type: boolean
      SUSFS:
        description: '集成 SUSFS 隐藏 (随 KernelSU-Next)'
        required: true
        default: true
        type: boolean
      LTO:
        description: '启用 LTO_CLANG_THIN 优化 (提速运行/增加编译时间)'
        required: true
        default: true
        type: boolean
      SSH:
        description: '编译失败时开启 tmate SSH 现场排错（默认关闭，避免暴露会话）'
        required: true
        default: false
        type: boolean

# 发布 Release 需要写入权限（可选步骤，不需要可删除）
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      TZ: Asia/Shanghai

    steps:
      # ---------------------------------------------------------------
      # 0. 检出当前仓库（含 lxc-server-defconfig.fragment）
      # ---------------------------------------------------------------
      - name: 检出仓库 / Checkout
        uses: actions/checkout@v4

      # ---------------------------------------------------------------
      # 1. 环境勘测（按任务一要求：lscpu / free -h / df -h）
      # ---------------------------------------------------------------
      - name: 环境勘测 / Environment Recon
        run: |
          echo "========== lscpu =========="; lscpu
          echo "========== free -h =========="; free -h
          echo "========== df -h =========="; df -h
          echo "========== nproc =========="; nproc
          echo "========== uname =========="; uname -a
          echo "========== os-release =========="; cat /etc/os-release

      # ---------------------------------------------------------------
      # 2. 极限清理磁盘（删 dotnet / android-sdk / haskell / codeql）
      # ---------------------------------------------------------------
      - name: 极限清理磁盘 / Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 4096
          swap-size-mb: 8192
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      # ---------------------------------------------------------------
      # 3. 安装依赖 + repo 工具
      # ---------------------------------------------------------------
      - name: 安装依赖 / Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl wget ca-certificates zip unzip \
            gcc g++ python3 python3-pip bison flex make \
            libssl-dev bc ccache binutils-aarch64-linux-gnu \
            gcc-aarch64-linux-gnu
          mkdir -p ~/bin
          curl -sSL https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod +x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"

      # ---------------------------------------------------------------
      # 4. 克隆内核源码（Xiaomichael manifest，depth=1 提速）
      # ---------------------------------------------------------------
      - name: 克隆内核源码 / Clone Kernel Source
        run: |
          mkdir -p kernel && cd kernel
          repo init -u https://github.com/Xiaomichael/kernel_manifest.git \
            -b refs/heads/oneplus/${{ inputs.CPU }} \
            -m ${{ inputs.FEIL }}.xml --depth=1
          repo sync -c -j"$(nproc --all)" --no-clone-bundle --no-tags

      # ---------------------------------------------------------------
      # 5. 拷贝并注入 defconfig 片段（GKI 合并后追加，保留 ACC 电池节点）
      # ---------------------------------------------------------------
      - name: 注入 LXC defconfig 片段 / Inject Fragment
        run: |
          # GKI 源码根：manifest 将 common 克隆到 kernel_platform/common
          cd kernel/kernel_platform/common
          # 生成片段文件：优先用仓库根内的 lxc-server-defconfig.fragment；
          # 若缺失则用内联 printf 生成，保证 self-contained（彻底规避 heredoc 缩进坑）。
          if [ -f "$GITHUB_WORKSPACE/lxc-server-defconfig.fragment" ]; then
            cp "$GITHUB_WORKSPACE/lxc-server-defconfig.fragment" lxc-server-defconfig.fragment
          else
            printf '%s\n' \
          '# === OnePlus Ace Pro (sm8475) LXC/Docker/SUSFS/BBR 片段（内联生成，等效于 lxc-server-defconfig.fragment）===' \
          '# 红线：绝不改动 CONFIG_QTI_BATTERY_CHARGER / CONFIG_OPLUS_CHG* / CONFIG_OPLUS_SM8450_CHARGER 等电池节点' \
          '# 1. 命名空间 (依赖 CONFIG_NAMESPACES)' \
          'CONFIG_PID_NS=y' \
          'CONFIG_IPC_NS=y' \
          'CONFIG_USER_NS=y' \
          'CONFIG_UTS_NS=y' \
          'CONFIG_NET_NS=y' \
          '# 2. systemd 依赖' \
          'CONFIG_POSIX_MQUEUE=y' \
          'CONFIG_CGROUP_DEVICE=y' \
          'CONFIG_AUDIT=y' \
          'CONFIG_AUDITSYSCALL=y' \
          'CONFIG_SECURITY_APPARMOR=y' \
          'CONFIG_AUTOFS_FS=y' \
          'CONFIG_FANOTIFY=y' \
          'CONFIG_FANOTIFY_ACCESS_PERMISSIONS=y' \
          '# 3. cgroups (依赖 CONFIG_CGROUPS)' \
          'CONFIG_CGROUP_PIDS=y' \
          'CONFIG_CGROUP_PERF=y' \
          'CONFIG_CGROUP_HUGETLB=y' \
          'CONFIG_CGROUP_RDMA=y' \
          'CONFIG_NET_CLS_CGROUP=y' \
          'CONFIG_CFS_BANDWIDTH=y' \
          '# 4. Docker bridge/NAT' \
          'CONFIG_BRIDGE_NETFILTER=y' \
          'CONFIG_IP6_NF_NAT=y' \
          'CONFIG_IP6_NF_TARGET_MASQUERADE=y' \
          'CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y' \
          'CONFIG_NETFILTER_XT_MATCH_IPVS=y' \
          'CONFIG_NETFILTER_XT_MATCH_COMMENT=y' \
          'CONFIG_NETFILTER_XT_TARGET_CHECKSUM=y' \
          '# 5. IPVS' \
          'CONFIG_IP_VS=y' \
          'CONFIG_IP_VS_NFCT=y' \
          'CONFIG_IP_VS_PROTO_TCP=y' \
          'CONFIG_IP_VS_PROTO_UDP=y' \
          'CONFIG_IP_VS_RR=y' \
          'CONFIG_IP_VS_WRR=y' \
          'CONFIG_IP_VS_SH=y' \
          '# 6. nftables' \
          'CONFIG_NF_TABLES=y' \
          'CONFIG_NFT_COMPAT=y' \
          'CONFIG_NFT_CT=y' \
          'CONFIG_NFT_FIB=y' \
          'CONFIG_NFT_FIB_IPV4=y' \
          'CONFIG_NFT_FIB_IPV6=y' \
          'CONFIG_NFT_MASQ=y' \
          'CONFIG_NFT_NAT=y' \
          '# 7. overlay/macvlan/ipvlan' \
          'CONFIG_VXLAN=y' \
          'CONFIG_BRIDGE_VLAN_FILTERING=y' \
          'CONFIG_MACVLAN=y' \
          'CONFIG_IPVLAN=y' \
          'CONFIG_TUN=y' \
          '# 8. KernelSU-Next' \
          'CONFIG_KSU=y' \
          '# 9. SUSFS' \
          'CONFIG_KSU_SUSFS=y' \
          'CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y' \
          'CONFIG_KSU_SUSFS_SUS_MOUNT=y' \
          'CONFIG_KSU_SUSFS_SUS_PATH=y' \
          'CONFIG_KSU_SUSFS_SPOOF_UNAME=y' \
          'CONFIG_KSU_MANUAL_HOOK=y' \
          '# 10. BBR + FQ' \
          'CONFIG_TCP_CONG_ADVANCED=y' \
          'CONFIG_TCP_CONG_BBR=y' \
          'CONFIG_NET_SCH_FQ=y' \
          'CONFIG_TCP_CONG_BIC=n' \
          'CONFIG_TCP_CONG_WESTWOOD=n' \
          'CONFIG_TCP_CONG_HTCP=n' \
          'CONFIG_TCP_CONG_CUBIC=y' \
          '# 10b. 服务器增强' \
          'CONFIG_WIREGUARD=y' \
          'CONFIG_ZRAM=y' \
          'CONFIG_CGROUP_V2=y' \
          'CONFIG_CPU_FREQ_GOV_PERFORMANCE=y' \
          'CONFIG_CPU_FREQ_GOV_SCHEDUTIL=y' \
          'CONFIG_CPU_FREQ_GOV_POWERSAVE=y' \
          'CONFIG_BRIDGE_IGMP_SNOOPING=y' \
          '# 11. 内核自述' \
          'CONFIG_IKCONFIG=y' \
          'CONFIG_IKCONFIG_PROC=y' \
          > lxc-server-defconfig.fragment
          fi
          # 注入 POST_DEFCONFIG_CMDS（build.sh 在生成 .config 后执行；${ROOT_DIR}=本目录）
          BCFG="build.config.msm.waipio"
          if [ -f "$BCFG" ]; then
            sed -i '/POST_DEFCONFIG_CMDS=/d' "$BCFG"
            printf '%s\n' '# ---- LXC/Docker/SUSFS/BBR 片段注入（build.sh 生成 defconfig 后生效）----
POST_DEFCONFIG_CMDS="cat ${ROOT_DIR}/lxc-server-defconfig.fragment >> ${OUT_DIR}/.config && make -C ${ROOT_DIR} O=${OUT_DIR} LLVM_IAS=1 LLVM=1 olddefconfig"' >> "$BCFG"
          else
            echo "WARN: $BCFG 未找到，回退直接追加到 gki_defconfig"
            cat lxc-server-defconfig.fragment >> arch/arm64/configs/gki_defconfig
          fi
          # 关闭 KMI 严格模式：我们刷入的是完整自编译内核，无需 KMI 符号兼容
          for f in build.config.gki.aarch64 build.config.msm.waipio; do
            [ -f "$f" ] || continue
            sed -i 's/^KMI_ENFORCED=.*/KMI_ENFORCED=0/' "$f"
            sed -i 's/^KMI_SYMBOL_LIST_STRICT_MODE=.*/KMI_SYMBOL_LIST_STRICT_MODE=0/' "$f"
          done
          # 关闭 defconfig 自检（我们主动改了配置，避免 check_defconfig 失败）
          [ -f build.config.gki ] && { sed -i 's/check_defconfig//' build.config.gki; sed -i 's/^CONFIG_HEADERS_INSTALL=.*/CONFIG_HEADERS_INSTALL=n/' build.config.gki; } || true

      # ---------------------------------------------------------------
      # 6. 集成 KernelSU-Next（强控制态核心）
      # ---------------------------------------------------------------
      - name: 集成 KernelSU-Next / Integrate KernelSU-Next
        if: ${{ inputs.KSU }}
        run: |
          cd kernel/kernel_platform
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/dev/kernel/setup.sh" | bash -s dev
          # 注：KernelSU-Next setup.sh 已对 GKI 5.10 做适配，会把 KSU 接入 common/ 树。
          # 若编出内核未含 KSU，请确认 common/ 下存在 KernelSU-Next/ 并手动 source 其 KernelSU.mk。

      # ---------------------------------------------------------------
      # 7. 集成 SUSFS（隐藏态，随 KernelSU-Next 版本内置/或独立补丁）
      # ---------------------------------------------------------------
      - name: 集成 SUSFS / Integrate SUSFS (gki-android12-5.10)
        if: ${{ inputs.SUSFS }}
        run: |
          cd kernel/kernel_platform
          # SUSFS 2.0 已随 KernelSU-Next 重定基，废弃 SUS_SU，改用 inline hooks（不依赖 KPROBES）
          # 注意：SUSFS 是“补丁集”，仅 clone 不会生效，必须按官方 README 复制并 patch
          git clone https://gitlab.com/simonpunk/susfs4ksu -b gki-android12-5.10 --depth=1 susfs4ksu
          # 10_ 补丁打到 KernelSU-Next 目录（KernelSU-Next 由上一阶段生成于 kernel_platform/）
          SUS_PATCH=$(find ./susfs4ksu -name '10_enable_susfs_for_ksu.patch' | head -n1)
          cp "$SUS_PATCH" ./KernelSU-Next/
          ( cd ./KernelSU-Next && patch -p1 < "$(basename "$SUS_PATCH")" )
          # 50_ 补丁 + 新增源文件打到 common（GKI 源码根）
          cd common
          cp ../susfs4ksu/kernel_patches/50_add_susfs_in_kernel-*.patch ./
          cp -r ../susfs4ksu/kernel_patches/fs/* ./fs/
          cp -r ../susfs4ksu/kernel_patches/include/linux/* ./include/linux/
          for f in 50_add_susfs_in_kernel-*.patch; do patch -p1 < "$f"; done
          echo "SUSFS 2.0 补丁已施加 (gki-android12-5.10)"

      # ---------------------------------------------------------------
      # 8. 编译内核（GKI, clang-r416183b + LLVM_IAS）
      # ---------------------------------------------------------------
      - name: 编译内核 / Build Kernel (GKI)
        run: |
          cd kernel/kernel_platform/common
          export PATH="$(pwd)/../prebuilts-master/clang/host/linux-x86/clang-r416183b/bin:$PATH"
          export PATH="$(pwd)/../prebuilts/kernel-build-tools/linux-x86/bin:$PATH"

          # 可选 LTO 优化（Xiaomichael 5.10 实测做法）
          if [ "${{ inputs.LTO }}" = "true" ]; then
            sed -i 's/^CONFIG_LTO=n/CONFIG_LTO=y/' arch/arm64/configs/gki_defconfig || true
            sed -i 's/^# CONFIG_LTO_CLANG_THIN is not set/CONFIG_LTO_CLANG_THIN=y/' arch/arm64/configs/gki_defconfig || true
            sed -i 's/^CONFIG_LTO_CLANG_THIN=n/CONFIG_LTO_CLANG_THIN=y/' arch/arm64/configs/gki_defconfig || true
          fi

          BUILD_CONFIG=build.config.msm.waipio VARIANT=gki build/build.sh

      # ---------------------------------------------------------------
      # 9. 打包 AnyKernel3（GKI 版模板，sm8475 适用）
      # ---------------------------------------------------------------
      - name: 打包 AnyKernel3 / Package
        run: |
          cd kernel/kernel_platform/common
          git clone https://github.com/Xiaomichael/AnyKernel3 --depth=1
          cp out/arch/arm64/boot/Image.lz4 AnyKernel3/Image.lz4
          [ -d out/arch/arm64/boot/dts ] && cp -r out/arch/arm64/boot/dts AnyKernel3/dtb 2>/dev/null || true
          cd AnyKernel3 && zip -r9 "$GITHUB_WORKSPACE/Kernel-AcePro-LXC.zip" ./*

      # ---------------------------------------------------------------
      # 10. 上传产物
      # ---------------------------------------------------------------
      - name: 上传产物 / Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-AcePro-LXC
          path: Kernel-AcePro-LXC.zip
          if-no-files-found: error

      # ---------------------------------------------------------------
      # 11. 发布 Release（可选）
      # ---------------------------------------------------------------
      - name: 发布 Release / Release (optional)
        if: ${{ success() && inputs.KSU }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sm8475-lxc-${{ github.run_number }}
          name: "Ace Pro LXC Kernel #${{ github.run_number }}"
          files: Kernel-AcePro-LXC.zip

      # ---------------------------------------------------------------
      # 12. 失败保留环境 / tmate SSH（便于现场排错）
      # ---------------------------------------------------------------
      - name: 失败保留环境 / tmate SSH on failure (需手动开启 SSH 输入)
        if: ${{ failure() && inputs.SSH }}
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true
